<button (click)="onShowDrawer()">Create Consumer</button>
<button (click)="dataSource$ = consumerService.getConsumers()">Refresh</button>

<table>
  <thead>
    <tr>
      <th *ngFor="let column of columns">{{ column.title | translate }}</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let data of dataSource$ | async">
      <td>{{ data.name }}</td>
      <td>
        <span *ngFor="let credential of data.credentials" [style.color]="getCredentialColor(credential.type)">
          {{ getCredentialType(credential.type) }}
        </span>
      </td>
      <td>
        <a (click)="onEditDrawer(data)">Edit</a>
        <a (click)="onShowModal(data)">Delete</a>
      </td>
    </tr>
  </tbody>
</table>

<div *ngIf="openDrawer">
  <h2>{{ currentConsumer ? "Edit Consumer" : "Create Consumer" | translate }}</h2>
  <form [formGroup]="form">
    <!-- I will implement the form later -->
  </form>
  <button (click)="handleDrawerOK()" [disabled]="!form.valid">Confirm</button>
  <button (click)="handleDrawerCancel()">Cancel</button>
</div>

<div *ngIf="openModal">
  <h2>Delete</h2>
  <p>Are you sure you want to delete {{ currentConsumer?.name }}?</p>
  <button (click)="handleModalOk()">Confirm</button>
  <button (click)="handleModalCancel()">Cancel</button>
</div>
